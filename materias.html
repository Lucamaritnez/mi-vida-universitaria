<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Vida Universitaria - Materias</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
    <script src="./js/ui.js"></script>
</head>
<body>
    <div class="app fade-in">
        <aside class="sidebar">
            <div class="brand"><i class="fa-solid fa-graduation-cap"></i><span>Mi Vida<br>Universitaria</span></div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
                <a href="materias.html" class="menu-item active"><i class="fa-solid fa-book"></i><span>Materias</span></a>
                <a href="agenda.html" class="menu-item"><i class="fa-regular fa-calendar"></i><span>Agenda</span></a>
                <a href="perfil.html" class="menu-item"><i class="fa-regular fa-user"></i><span>Perfil</span></a>
                <a href="ayuda.html" class="menu-item"><i class="fa-regular fa-circle-question"></i><span>Ayuda</span></a>
            </nav>

            <div class="sidebar-pomodoro">
                <div class="sidebar-pomo-title">
                    <span><i class="fa-solid fa-stopwatch"></i> Pomodoro</span>
                    <i class="fa-solid fa-circle-info" id="sidebarPomoInfo" style="cursor: pointer;" title="¿Cómo funciona?"></i>
                </div>
                <div class="sidebar-pomo-timer" id="sidebarPomoTimer">25:00</div>
                <div class="sidebar-pomo-btns">
                    <button class="sidebar-pomo-btn" id="sidebarPomoStart">Iniciar</button>
                    <button class="sidebar-pomo-btn reset" id="sidebarPomoReset">Reset</button>
                </div>
            </div>

            <button id="logoutButton" class="logout" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Cerrar sesión</span></button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="date-badge">
                    <i class="fa-solid fa-book"></i>
                    <span>Mis Materias</span>
                </div>
                <div class="user">
                    <button id="themeToggle" class="theme-btn" title="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
                    <div class="avatar" id="userAvatar">U</div>
                </div>
            </header>

            <section class="dashboard">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap:15px;">
                    <div>
                        <h1 style="color: var(--dark); font-weight: 700; font-size: 24px;">Mis Materias</h1>
                        <p class="subtitle" style="margin-bottom:0;">Administrá tus cursadas y sus detalles.</p>
                    </div>
                    <button id="btnNuevaMateria" class="btn-primary" type="button" style="width: auto; padding: 0 20px;"><i class="fa-solid fa-plus"></i> Nueva Materia</button>
                </div>

                <div id="materiaFormSection" class="stat-card fade-in" style="display: none; max-width: 600px; margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; color: var(--dark);">Agregar Materia</h3>
                    <input type="text" id="materiaNombre" placeholder="Nombre de la materia (Ej: Álgebra)" class="input-group" style="margin-bottom:10px;">
                    <input type="text" id="materiaProfesor" placeholder="Profesor/a (Opcional)" class="input-group" style="margin-bottom:10px;">
                    <input type="text" id="materiaHorario" placeholder="Día y Horario (Ej: Lunes 18:00hs)" class="input-group" style="margin-bottom:15px;">
                    <button id="btnGuardarMateria" class="btn-primary" type="button">Guardar Materia</button>
                </div>

                <div id="listaMaterias"></div>
                <div id="emptyMaterias" class="empty-state" style="display: none;">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <h3>No tenés materias registradas</h3>
                    <p style="font-size: 13px; margin-top: 4px;">Hacé clic en "Nueva Materia" para comenzar.</p>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="bottom-item"><i class="fa-solid fa-house"></i>Inicio</a>
            <a href="materias.html" class="bottom-item active"><i class="fa-solid fa-book"></i>Materias</a>
            <a href="agenda.html" class="bottom-item"><i class="fa-regular fa-calendar"></i>Agenda</a>
            <a href="perfil.html" class="bottom-item"><i class="fa-regular fa-user"></i>Perfil</a>
            <a href="ayuda.html" class="bottom-item"><i class="fa-regular fa-circle-question"></i>Ayuda</a>
        </nav>
    </div>
    <script src="./js/materias.js"></script>
</body>
</html>
