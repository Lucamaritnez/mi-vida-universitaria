<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Vida Universitaria - Agenda</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
    <script src="./js/ui.js"></script>
</head>
<body>
    <div class="app fade-in">
        <aside class="sidebar">
            <div class="brand"><i class="fa-solid fa-graduation-cap"></i><span>Mi Vida<br>Universitaria</span></div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
                <a href="materias.html" class="menu-item"><i class="fa-solid fa-book"></i><span>Materias</span></a>
                <a href="agenda.html" class="menu-item active"><i class="fa-regular fa-calendar"></i><span>Agenda</span></a>
                <a href="perfil.html" class="menu-item"><i class="fa-regular fa-user"></i><span>Perfil</span></a>
                <a href="ayuda.html" class="menu-item"><i class="fa-regular fa-circle-question"></i><span>Ayuda</span></a>
            </nav>

            <div class="sidebar-pomodoro">
                <div class="sidebar-pomo-title">
                    <span><i class="fa-solid fa-stopwatch"></i> Pomodoro</span>
                    <i class="fa-solid fa-circle-info" id="sidebarPomoInfo" style="cursor: pointer;" title="¿Cómo funciona?"></i>
                </div>
                <div class="sidebar-pomo-timer" id="sidebarPomoTimer">25:00</div>
                <div class="sidebar-pomo-btns">
                    <button class="sidebar-pomo-btn" id="sidebarPomoStart">Iniciar</button>
                    <button class="sidebar-pomo-btn reset" id="sidebarPomoReset">Reset</button>
                </div>
            </div>

            <button id="logoutButton" class="logout" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Cerrar sesión</span></button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="date-badge">
                    <i class="fa-regular fa-calendar-days"></i>
                    <span>Agenda Global</span>
                </div>
                <div class="user">
                    <button id="themeToggle" class="theme-btn" title="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
                    <div class="avatar" id="userAvatar">U</div>
                </div>
            </header>

            <section class="dashboard">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap:15px;">
                    <div>
                        <h1 style="color: var(--dark); font-weight: 700; font-size: 24px;">Agenda Global</h1>
                        <p class="subtitle" style="margin-bottom:0;">Todos tus compromisos agendados.</p>
                    </div>
                    <button id="addEventButton" class="btn-primary" type="button" style="width: auto; padding: 0 20px;"><i class="fa-solid fa-plus"></i> Nuevo Evento</button>
                </div>

                <div id="eventForm" class="stat-card fade-in" style="display: none; max-width: 600px; margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; color: var(--dark);">Agendar Evento</h3>
                    <input type="text" id="eventTitle" placeholder="Título (Ej: Entrega de Trabajo)" class="input-group" style="margin-bottom:10px;">
                    
                    <div class="input-group" style="margin-bottom:10px; padding: 0 10px;">
                        <i class="fa-solid fa-book" style="color: var(--text-light); margin-left: 5px;"></i>
                        <select id="eventSubjectSelect" style="width: 100%; height: 100%; background: transparent; border: none; outline: none; color: var(--text);">
                            <option value="General">Materia: General</option>
                        </select>
                    </div>

                    <input type="date" id="eventDate" class="input-group" style="margin-bottom:10px;">

                    <div class="input-group" style="margin-bottom:15px; padding: 0 10px;">
                        <i class="fa-solid fa-tag" style="color: var(--text-light); margin-left: 5px;"></i>
                        <select id="eventType" style="width: 100%; height: 100%; background: transparent; border: none; outline: none; color: var(--text);">
                            <option value="Examen">Examen</option>
                            <option value="TP">TP</option>
                            <option value="Entrega">Entrega</option>
                            <option value="Final">Examen Final</option>
                        </select>
                    </div>

                    <button id="saveEventButton" class="btn-primary" type="button">Guardar Evento</button>
                </div>

                <!-- FILTROS DE AGENDA -->
                <div class="filter-container" id="filterContainer">
                    <button class="filter-btn active" data-filter="todos">Todos</button>
                    <button class="filter-btn" data-filter="Examen">Exámenes</button>
                    <button class="filter-btn" data-filter="TP">TPs</button>
                    <button class="filter-btn" data-filter="Entrega">Entregas</button>
                    <button class="filter-btn" data-filter="Final">Finales</button>
                </div>

                <div id="eventsList"></div>
                <div id="emptyEvents" class="empty-state" style="display: none;">
                    <i class="fa-regular fa-calendar-xmark"></i>
                    <h3>No hay eventos en esta categoría</h3>
                    <p style="font-size: 13px; margin-top: 4px;">Agregá nuevos compromisos para organizarte mejor.</p>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="bottom-item"><i class="fa-solid fa-house"></i>Inicio</a>
            <a href="materias.html" class="bottom-item"><i class="fa-solid fa-book"></i>Materias</a>
            <a href="agenda.html" class="bottom-item active"><i class="fa-regular fa-calendar"></i>Agenda</a>
            <a href="perfil.html" class="bottom-item"><i class="fa-regular fa-user"></i>Perfil</a>
            <a href="ayuda.html" class="bottom-item"><i class="fa-regular fa-circle-question"></i>Ayuda</a>
        </nav>
    </div>
    <script src="./js/agenda.js"></script>
</body>
</html>
