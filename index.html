<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vida Universitaria - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="login-page fade-in">
        <div class="login-card">
            <div class="login-content">
                <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
                <h1>¡Hola de nuevo!</h1>
                <p class="subtitle">Iniciá sesión para organizar tus estudios.</p>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn-primary">Ingresar</button>
                </form>
                <a href="recuperar.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
                <p class="register-text">¿No tenés cuenta? <a href="registro.html">Registrate acá</a></p>
            </div>
            <div class="login-decoration"><div class="decoration-text"><h2>Tu universidad,<br>en un solo lugar</h2><p>Organizá todo inteligentemente.</p></div></div>
        </div>
    </div>
    <script src="./js/ui.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
