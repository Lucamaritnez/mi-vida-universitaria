<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vida Universitaria - Recuperar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="login-page fade-in">
        <div class="login-card" style="grid-template-columns: 1fr;">
            <div class="login-content" style="max-width: 500px; margin: 0 auto;">
                <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
                <h1>Recuperar contraseña</h1>
                <p class="subtitle">Ingresá tu correo para que te mostremos tu clave.</p>
                <form id="recuperarForm">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="Tu correo electrónico" required>
                    </div>
                    <button type="submit" class="btn-primary">Recuperar</button>
                </form>
                <p class="register-text"><a href="index.html">Volver a inicio de sesión</a></p>
            </div>
        </div>
    </div>
    <script src="./js/ui.js"></script>
    <script src="./js/recuperar.js"></script>
</body>
</html>
