<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vida Universitaria - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="login-page fade-in">
        <div class="login-card">
            <div class="login-content">
                <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
                <h1>Crear cuenta</h1>
                <p class="subtitle">Sumate y empezá a organizar tus materias.</p>
                <form id="registroForm">
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Crea una contraseña" required>
                    </div>
                    <button type="submit" class="btn-primary">Registrarme</button>
                </form>
                <p class="register-text">¿Ya tenés cuenta? <a href="index.html">Iniciá sesión acá</a></p>
            </div>
            <div class="login-decoration"><div class="decoration-text"><h2>El primer paso al éxito</h2><p>Registrate gratis y tomá el control.</p></div></div>
        </div>
    </div>
    <script src="./js/ui.js"></script>
    <script src="./js/registro.js"></script>
</body>
</html>
